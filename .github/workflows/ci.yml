name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run automatically at 8AM PST Monday-Friday
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Secret-less supply-chain gate — its own job so the clean-room install is
  # truly isolated, and so it runs identically on fork and same-repo PRs.
  composer-lockfile-hygiene:
    name: Composer lockfile hygiene
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: twilio/sdk-actions/composer-lockfile-hygiene@09631bfa50f14d276170d45bc4f49a80da201cc6 # main @ 09631bf — sdk-actions#10; repin to the v1.1.0 tag once cut

  test:
    name: Test
    # Forks can't use the internal runner group; fall back to ubuntu-latest.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'ubuntu-x64' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The library's only runtime requirement is PHP itself
        # (`require: { php: ">=7.1.0" }`), so PHP version IS the matrix.
        #
        # There is deliberately no `lowest` / `highest` dependency axis. The old
        # workflow had one, but it never ran: `make install` depended on `clean`,
        # which did `rm -rf ... composer.lock`, so the lockfile that
        # `composer update --prefer-lowest` had just written was deleted and the
        # following `composer install` resolved newest again. #928 dropped
        # composer.lock from `clean`, which made the axis real for the first time
        # — and it cannot pass: `--prefer-lowest` selects phpunit 7.0.0, which
        # dies on PHP >= 8.1 with "Cannot acquire reference to $GLOBALS".
        #
        # No single constraint set can fix that. The floor would have to be old
        # enough for PHP 7.2 (phpunit 8 is its ceiling) and new enough to run on
        # PHP 8.4 (needs phpunit >= 9.6). Since the axis only ever varied *dev*
        # tooling — nothing a consumer of this package resolves — it buys no
        # signal worth per-PHP-version pinning.
        php: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # full history for analysis relevance

      # setup-php FIRST — artifactory-oidc shells out to `composer`.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      # Forks have no Artifactory secret; skip login and resolve from public Packagist.
      - if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        uses: twilio/sdk-actions/artifactory-oidc@09631bfa50f14d276170d45bc4f49a80da201cc6 # main @ 09631bf — sdk-actions#10; repin to the v1.1.0 tag once cut
        with:
          ecosystem: php

      # The committed composer.lock pins php-cs-fixer's symfony 7.4.x deps, which
      # require PHP >= 8.2, so on older PHP the lock is not installable at all.
      # Those versions resolve a compatible dev toolchain instead. What the matrix
      # is testing is the library's own contract (`require.php: >=7.1.0`); the dev
      # toolchain is incidental to that.
      - name: Install dependencies
        env:
          PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          if printf '%s\n' 8.2 8.3 8.4 | grep -qx "$PHP"; then
            echo "::notice::Installing from the committed composer.lock"
            composer install --no-interaction --no-progress
          else
            echo "::notice::PHP ${PHP} predates the locked dev toolchain; resolving fresh"
            composer update --no-interaction --no-progress
          fi

      - name: Run tests
        run: make test

  # ---------------------------------------------------------------------------
  # Cluster test hits LIVE Twilio APIs with real credentials.
  #
  # ⚠️  ACTION REQUIRED — THE CREDENTIALS ARE DEAD.
  #     All five ClusterTest cases currently fail `HTTP 401 Authenticate`. This
  #     is NOT caused by the workflow rewrite: the env block below is byte-for-
  #     byte the same as the old test-and-deploy.yml, and the same secrets last
  #     passed on 2026-05-11 (run 25681515425). The API key behind
  #     TWILIO_CLUSTER_TEST_API_KEY / _SECRET (set 2022-12-15) has since been
  #     rotated or revoked on the Twilio account side.
  #
  #     To restore: mint a new API key on the cluster-test account and update
  #     TWILIO_CLUSTER_TEST_API_KEY + TWILIO_CLUSTER_TEST_API_KEY_SECRET, then
  #     drop `continue-on-error` below.
  #
  # Until then this runs on schedule/dispatch only and cannot block a merge:
  # live-API tests cost money, flake, and must never expose secrets to fork PRs.
  # ---------------------------------------------------------------------------
  cluster-test:
    name: Cluster test
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true # remove once the API key above is rotated
    runs-on: ubuntu-x64
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - uses: twilio/sdk-actions/artifactory-oidc@09631bfa50f14d276170d45bc4f49a80da201cc6 # main @ 09631bf — sdk-actions#10; repin to the v1.1.0 tag once cut
        with:
          ecosystem: php

      - run: composer install --no-interaction --no-progress

      - name: Run cluster test
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_CLUSTER_TEST_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_CLUSTER_TEST_API_KEY_SECRET }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
          TWILIO_ORGS_CLIENT_ID: ${{ secrets.TWILIO_ORGS_CLIENT_ID }}
          TWILIO_ORGS_CLIENT_SECRET: ${{ secrets.TWILIO_ORGS_CLIENT_SECRET }}
          TWILIO_ORG_SID: ${{ secrets.TWILIO_ORG_SID }}
          TWILIO_CLIENT_ID: ${{ secrets.TWILIO_CLIENT_ID }}
          TWILIO_CLIENT_SECRET: ${{ secrets.TWILIO_CLIENT_SECRET }}
          TWILIO_MESSAGE_SID: ${{ secrets.TWILIO_MESSAGE_SID }}
        run: make cluster-test
