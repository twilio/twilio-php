name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  lockfile-hygiene:
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: twilio/sdk-actions/composer-lockfile-hygiene@f293ed2cd776fd9476360826a78b7b33e692b261 # main (pending v1 tag update)

  test:
    name: Test - PHP ${{ matrix.php }}
    needs: [lockfile-hygiene]
    runs-on: ubuntu-x64
    if: github.repository_owner == 'twilio'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@f293ed2cd776fd9476360826a78b7b33e692b261 # main (pending v1 tag update)
        with:
          ecosystem: php

      - name: Install dependencies
        env:
          PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          if printf '%s\n' 8.2 8.3 8.4 | grep -qx "$PHP"; then
            composer install --no-interaction --no-progress
          else
            composer update --no-interaction --no-progress
          fi

      - name: Run tests
        run: make test
