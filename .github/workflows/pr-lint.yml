name: Lint PR
on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: twilio/sdk-actions/semantic-pr-title@PENDING_SDK_ACTIONS_SHA # v1.1.0
        with:
          types: |
            chore
            docs
            fix
            feat
            misc
            test
